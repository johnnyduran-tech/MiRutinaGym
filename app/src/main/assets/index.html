<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0e14"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Mi Rutina Gym</title>
<style>:root{color-scheme:dark;--bg:#0b0e14;--card:#151a24;--card2:#1c2230;--line:#2a3242;--tx:#eef1f7;--mut:#8b94a8;--acc:#ff7a3d;--acc2:#ffb08a;--ok:#3ccf8e;--warn:#ffcc4d;--bad:#ff5a6a;--blue:#4c7dff;--r:16px;
--safe-b:env(safe-area-inset-bottom,0px);
--hdr:rgba(11,14,20,.92);--navbg:rgba(15,19,27,.96);--hero:linear-gradient(135deg,#2a1608,#151a24 60%);--herob:#4a2a16;--ph:#566078;
--tipbg:rgba(76,125,255,.1);--tipbd:rgba(76,125,255,.35);--tiptx:#c5d4ff;--wbg:rgba(255,204,77,.08);--wbd:rgba(255,204,77,.35);--wtx:#ffe7a6;
--timerbg:#11161f;--toast:#273044;--scrim:rgba(0,0,0,.6);--chartgrid:#2a3242;--chartdot:#151a24;
--ap-bg1:#1d2433;--ap-bg2:#121722;--ap-body:#e9edf5;--ap-eq:#2c3547;--ap-eqs:#4a5670;--ap-line:#46526a;--ap-floor:#3a4458;--ap-wall:#262e3e;--ap-cable:#c9d2e3;--ap-plate:#8d99b3;--ap-bar:#9aa6bf}
:root[data-theme=light]{color-scheme:light;--bg:#f3f4f7;--card:#ffffff;--card2:#eef0f5;--line:#dde1e9;--tx:#151a24;--mut:#5d6677;--acc:#f26a2b;--acc2:#c4521c;--ok:#1e9e64;--warn:#b98a0c;--bad:#d63848;--blue:#3a66e0;
--hdr:rgba(243,244,247,.92);--navbg:rgba(255,255,255,.96);--hero:linear-gradient(135deg,#ffe6d6,#ffffff 65%);--herob:#f7c9ad;--ph:#9aa2b2;
--tipbg:rgba(58,102,224,.08);--tipbd:rgba(58,102,224,.3);--tiptx:#25428f;--wbg:rgba(230,170,20,.1);--wbd:rgba(200,150,10,.4);--wtx:#7a5a00;
--timerbg:#ffffff;--toast:#ffffff;--scrim:rgba(20,25,35,.35);--chartgrid:#e3e6ec;--chartdot:#ffffff;
--ap-bg1:#f1f4f9;--ap-bg2:#e2e7ef;--ap-body:#2a3142;--ap-eq:#cfd6e2;--ap-eqs:#a9b3c4;--ap-line:#aab3c3;--ap-floor:#b8c0ce;--ap-wall:#d7dde7;--ap-cable:#5b6577;--ap-plate:#6b778d;--ap-bar:#5b6577}
:root[data-theme=light] .card,:root[data-theme=light] .timer .in,:root[data-theme=light] .toast{box-shadow:0 1px 3px rgba(20,30,50,.07)}
:root[data-theme=light] .btn.pri,:root[data-theme=light] .seg button.on,:root[data-theme=light] .cycle span.cur{color:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + var(--safe-b))}
header.top{position:sticky;top:0;z-index:20;background:var(--hdr);backdrop-filter:blur(10px);padding:calc(14px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:1px solid var(--line)}
header.top h1{margin:0;font-size:20px;letter-spacing:-.3px}
header.top .sub{color:var(--mut);font-size:13px;margin-top:2px}
main{padding:14px 14px 20px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;justify-content:center;background:var(--navbg);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav.tabs .in{display:flex;max-width:640px;width:100%}
nav.tabs button{flex:1;background:none;border:0;padding:9px 0 10px;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2{margin:0 0 6px;font-size:18px}
.card h3{margin:0 0 6px;font-size:15px}
.mut{color:var(--mut)} .small{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--card2);border:1px solid var(--line);font-weight:600;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#1a0d05}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#04130c}
.btn.bad{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.ghost{background:transparent}
.btn.blk{width:100%;display:block}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.ibtn{background:var(--card2);border:1px solid var(--line);border-radius:10px;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.ibtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:12px;color:var(--mut);margin:2px 4px 2px 0}
.pill.acc{color:var(--acc);border-color:rgba(255,122,61,.4);background:rgba(255,122,61,.08)}
.pill.ok{color:var(--ok);border-color:rgba(60,207,142,.4)}
.hero{background:var(--hero);border-color:var(--herob)}
.hero .day{font-size:12px;color:var(--acc2);font-weight:700;letter-spacing:1px;text-transform:uppercase}
.hero h2{font-size:24px;margin:4px 0}
.cycle{display:flex;gap:5px;margin:12px 0 4px}
.cycle span{flex:1;height:30px;border-radius:8px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--mut);border:1px solid var(--line)}
.cycle span.rest{opacity:.55}
.cycle span.cur{background:var(--acc);color:#1a0d05;border-color:var(--acc)}
.exl{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.exl:first-child{border-top:0}
.exl .th{width:74px;flex:none}
.exl .nm{font-weight:600}
.exl .meta{color:var(--mut);font-size:12.5px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--acc)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.modal-bg{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fd .15s}
.modal{background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:16px 16px calc(18px + var(--safe-b));animation:su .2s ease-out}
.modal h2{margin:0 0 12px;font-size:19px}
@keyframes su{from{transform:translateY(40px);opacity:.4}}
@keyframes fd{from{opacity:0}}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px;color:var(--mut);font-weight:600;font-size:13.5px}
.seg button.on{background:var(--acc);color:#1a0d05}
/* Entreno */
.wk-top{display:flex;align-items:center;gap:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 11px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:12.5px;color:var(--mut);white-space:nowrap}
.chip.on{border-color:var(--acc);color:var(--tx)}
.chip.done{color:var(--ok);border-color:rgba(60,207,142,.5)}
.sets{width:100%;border-collapse:separate;border-spacing:0 6px}
.sets th{font-size:11.5px;color:var(--mut);font-weight:600;text-align:center;padding:0 2px}
.sets td{text-align:center;padding:0 2px}
.sets td.n{width:30px;font-weight:700;color:var(--mut)}
.sets input{width:100%;min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 4px;text-align:center;font-weight:600;font-size:16px;outline:none}
.sets input:focus{border-color:var(--acc)}
.sets input::placeholder{color:var(--ph);font-weight:500}
.sets tr.done input{border-color:rgba(60,207,142,.45);background:rgba(60,207,142,.07)}
.chk{width:44px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.chk svg{width:20px;height:20px;stroke:var(--mut);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
tr.done .chk{background:var(--ok);border-color:var(--ok)} tr.done .chk svg{stroke:#04130c}
.tip{background:var(--tipbg);border:1px solid var(--tipbd);color:var(--tiptx);border-radius:12px;padding:9px 11px;font-size:13px;margin:8px 0}
.tip.warn{background:var(--wbg);border-color:var(--wbd);color:var(--wtx)}
.timer{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center}
.timer .in{width:100%;max-width:640px;background:var(--timerbg);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:14px 16px calc(16px + var(--safe-b));box-shadow:0 -10px 40px rgba(0,0,0,.5);animation:su .2s}
.timer .lbl{font-size:12px;color:var(--acc2);font-weight:700;letter-spacing:1px;text-transform:uppercase}
.timer .big{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1px;line-height:1.05}
.timer .bar{height:6px;background:var(--card2);border-radius:9px;overflow:hidden;margin:8px 0 12px}
.timer .bar i{display:block;height:100%;background:var(--acc);transition:width .25s linear}
.timer.end .big{color:var(--ok)}
.hold{font-size:44px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:30px 10px;color:var(--mut)}
.hist{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.hist:first-child{border-top:0}
.dt{width:46px;text-align:center;flex:none;background:var(--card2);border-radius:10px;padding:5px 0}
.dt b{display:block;font-size:18px}
.dt span{font-size:10.5px;color:var(--mut);text-transform:uppercase}
.chart{width:100%;height:auto;display:block}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl td,.tbl th{padding:7px 4px;border-top:1px solid var(--line);text-align:left}
.tbl th{color:var(--mut);font-weight:600;font-size:12px}
input[type=range]{width:100%;accent-color:var(--acc)}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.toggle:first-of-type{border-top:0}
.sw{width:48px;height:28px;border-radius:99px;background:var(--card2);border:1px solid var(--line);position:relative;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--mut);transition:.15s}
.sw.on{background:var(--acc);border-color:var(--acc)} .sw.on::after{left:23px;background:#fff}
.info p{margin:6px 0} .info ul{margin:6px 0;padding-left:18px} .info li{margin:3px 0}
.toast{position:fixed;left:50%;bottom:calc(150px + var(--safe-b));transform:translateX(-50%);background:var(--toast);color:var(--tx);border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;animation:fd .2s;max-width:90%}
.animbox{position:relative}
.animbox .tag{position:absolute;left:10px;bottom:8px;font-size:11px;color:#4a5160;background:rgba(255,255,255,.9);border:1px solid #e1e4e9;padding:2px 8px;border-radius:7px}
details.acc summary{cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;justify-content:space-between}
details.acc summary::after{content:"▾";color:var(--mut)}
details.acc[open] summary::after{content:"▴"}

.excard.cur{border-color:var(--acc);box-shadow:0 0 0 1px rgba(255,122,61,.35)}
.excard.fin{border-color:rgba(60,207,142,.45)}
.excard .th svg.anim{border-radius:10px}
.ro-list{display:flex;flex-direction:column;gap:6px}
.ro-it{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:6px 8px;position:relative;transition:box-shadow .15s}
.ro-it.drag{z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.5);border-color:var(--acc);transition:none}
.ro-it .nm{font-weight:600;font-size:14px}
.ro-h{font-size:20px;color:var(--mut);padding:8px 6px;cursor:grab;touch-action:none;user-select:none}
.ibtn svg.dots circle{fill:currentColor;stroke:none}

.minibar{position:fixed;left:0;right:0;bottom:calc(58px + var(--safe-b));z-index:35;display:flex;justify-content:center;padding:0 10px 8px;pointer-events:none}
.minibar .in{pointer-events:auto;width:100%;max-width:620px;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--acc);border-radius:16px;padding:9px 10px 9px 12px;box-shadow:0 8px 28px rgba(0,0,0,.35);cursor:pointer;animation:su .2s}
.mb-dot{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 0 rgba(60,207,142,.6);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(60,207,142,.55)}70%{box-shadow:0 0 0 9px rgba(60,207,142,0)}100%{box-shadow:0 0 0 0 rgba(60,207,142,0)}}
.mb-t{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mb-s{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mb-r{font-weight:800;font-variant-numeric:tabular-nums;font-size:15px;color:var(--acc);white-space:nowrap}
.mb-r:not(.on){display:none}
.mb-r.end{color:var(--ok)}
#app.withmini{padding-bottom:calc(150px + var(--safe-b))}

/* Lienzo de animación: estilo ilustración anatómica sobre fondo claro (igual en tema claro y oscuro) */
svg.anim{width:100%;height:auto;display:block;background:radial-gradient(ellipse at 50% 38%,#ffffff 0%,#f6f7f9 55%,#eceef2 100%);border-radius:14px}
svg.anim .ap-shadow{fill:#d9dce2;opacity:.55}
.ap-floor{stroke:#e1e4e9;stroke-width:1.5}
.ap-eq{fill:#2f333b;stroke:#1d2026;stroke-width:1}
.ap-eqline{stroke:#b9bec7;stroke-linecap:round}
.ap-wall{fill:#e6e9ee;stroke:#cfd4dc}
.ap-pulley{fill:#f2f3f5;stroke:#7d8592;stroke-width:2}
.ap-cable{stroke:#4a505b;stroke-dasharray:none;stroke-width:1.2}
.ap-lever{stroke:#a9afb9;stroke-linecap:round}
.ap-far{opacity:.55}
.ap-bar{stroke:#5b616c;stroke-linecap:round}
.ap-plate{fill:#1f2228;stroke:#000;stroke-width:.6}
.ap-pad{fill:#2f333b}
.ap-txt{fill:#e0452b;font:700 9px system-ui;letter-spacing:.5px}
/* cuerpo */
.bd{fill:#e3e5e9;stroke:#868d99;stroke-width:1;stroke-linejoin:round}
.bf{fill:#cfd2d8;stroke:#8f96a2;stroke-width:1;stroke-linejoin:round}
.mdef{fill:#eceef1;stroke:#b3b8c1;stroke-width:.6}
.mdef2{fill:#cfd2d8;stroke:#9aa1ad;stroke-width:.6}
.mline{stroke:#aab0ba;stroke-width:.7;stroke-linecap:round}
.shorts{fill:#2c3038;stroke:#1a1d22;stroke-width:.8}
.shortsf{fill:#3a3f48;stroke:#1a1d22;stroke-width:.8}
.hair{fill:#3b3f46}
/* músculos trabajados: principal rojo, secundarios naranja */
.m1{fill:#e2412a;stroke:#b8321f;stroke-width:.5;opacity:.93}
.m2{fill:#f08a62;stroke:#d06a45;stroke-width:.5;opacity:.88}
.m1.far,.m2.far{opacity:.6}
svg.anim.pulse .m1{fill:#ff5e43}
.eye{fill:#4a4f58}
</style></head>
<body><div id="app"></div>
<script>/* ===== Motor de animación de ejercicios (figura articulada con cinemática directa) ===== */
const ANIM = (() => {
  const L = { torso: 50, neck: 7, head: 9, ua: 28, fa: 25, th: 38, sh: 36, ft: 13 };
  const rad = d => d * Math.PI / 180;
  const pt = (p, len, a) => ({ x: p.x + len * Math.cos(rad(a)), y: p.y - len * Math.sin(rad(a)) });
  const FLOOR = 186;

  // Utilidades para props estáticos
  const floor = `<line x1="0" y1="${FLOOR + 2}" x2="240" y2="${FLOOR + 2}" class="ap-floor"/>`;
  const rect = (x, y, w, h, r = 3) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" class="ap-eq"/>`;
  const line = (x1, y1, x2, y2, w = 6) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-width="${w}" class="ap-eqline"/>`;
  const pulley = (x, y) => `<circle cx="${x}" cy="${y}" r="5" class="ap-pulley"/>`;
  const seat = (x, y, w) => rect(x, y, w, 7) + line(x + w / 2, y + 7, x + w / 2, FLOOR, 5);

  const LIB = {
    chest_press: {
      name: 'Press de pecho (máquina)', view: 'side', hl: ['torso', 'ua'],
      props: floor + seat(68, 154, 55) + line(86, 156, 79, 96, 7) + line(50, 76, 50, FLOOR, 8) + pulley(50, 84),
      link: { from: [50, 84], kind: 'lever' }, grip: 'handle',
      A: { hx: 95, hy: 150, torso: 95, ua: -150, fa: 2, th: 0, sh: -90 },
      B: { hx: 95, hy: 150, torso: 95, ua: -4, fa: 0, th: 0, sh: -90 },
      muscles: 'Pectoral mayor, deltoides anterior, tríceps',
      cues: ['Ajusta el asiento: agarres a la altura media del pecho.', 'Escápulas atrás y abajo, pecho alto.', 'Empuja sin bloquear los codos al final.', 'Regresa lento (2–3 s) hasta sentir estiramiento en el pecho.']
    },
    incline_machine_press: {
      name: 'Press inclinado (máquina)', view: 'side', hl: ['torso', 'ua'],
      props: floor + seat(68, 154, 55) + line(88, 156, 76, 92, 7) + line(48, 56, 48, FLOOR, 8) + pulley(48, 64),
      link: { from: [48, 64], kind: 'lever' }, grip: 'handle',
      A: { hx: 95, hy: 150, torso: 103, ua: -150, fa: 18, th: 0, sh: -90 },
      B: { hx: 95, hy: 150, torso: 103, ua: 38, fa: 38, th: 0, sh: -90 },
      muscles: 'Pectoral superior (clavicular), deltoides anterior, tríceps',
      cues: ['Agarres a la altura de la parte alta del pecho.', 'Empuja hacia arriba y adelante siguiendo la máquina.', 'Codos a ~45° del torso, no abiertos a 90°.', 'Baja controlado sin perder el contacto de la espalda.']
    },
    incline_db_press: {
      name: 'Press inclinado con mancuernas', view: 'side', hl: ['torso', 'ua'],
      props: floor + line(140, 152, 98, 112, 9) + line(122, 156, 122, FLOOR, 5) + line(102, 120, 102, FLOOR, 5),
      grip: 'db',
      A: { hx: 135, hy: 145, torso: 132, ua: 225, fa: 60, th: -10, sh: -95 },
      B: { hx: 135, hy: 145, torso: 132, ua: 45, fa: 45, th: -10, sh: -95 },
      muscles: 'Pectoral superior, deltoides anterior, tríceps',
      cues: ['Banco a 30–45°.', 'Mancuernas bajan a los lados del pecho alto, codos a ~45°.', 'Sube juntando ligeramente las mancuernas, sin chocarlas.', 'Pies firmes en el suelo, sin arquear en exceso la zona lumbar.']
    },
    seated_row: {
      name: 'Remo sentado (máquina)', view: 'side', hl: ['ua', 'torso'],
      props: floor + seat(58, 154, 50) + rect(97, 106, 7, 30) + line(101, 136, 101, 154, 5) + line(205, 60, 205, FLOOR, 8) + pulley(200, 118),
      link: { from: [200, 118], kind: 'cable' }, grip: 'handle',
      A: { hx: 82, hy: 150, torso: 90, hax: 134, hay: 116, ab: -1, th: 0, sh: -90 },
      B: { hx: 82, hy: 150, torso: 90, hax: 96, hay: 118, ab: -1, th: 0, sh: -90 },
      muscles: 'Dorsal ancho, romboides, trapecio medio, bíceps',
      cues: ['Pecho apoyado o torso erguido, sin balancearte.', 'Inicia el movimiento llevando las escápulas atrás.', 'Tira con los codos pegados hasta el abdomen.', 'Estira los brazos de forma controlada sin redondear la espalda.']
    },

  // cinemática inversa de 2 segmentos: devuelve [ángulo1, ángulo2]
  function ik(P, T, a, b, bend) {
    const dx = T.x - P.x, dy = P.y - T.y; let d = Math.hypot(dx, dy);
    d = Math.max(Math.abs(a - b) + 0.01, Math.min(a + b - 0.01, d));
    const base = Math.atan2(dy, dx) * 180 / Math.PI;
    const al = Math.acos((a * a + d * d - b * b) / (2 * a * d)) * 180 / Math.PI;
    const a1 = base + bend * al; const E = pt(P, a, a1);
    const a2 = Math.atan2(E.y - T.y, T.x - E.x) * 180 / Math.PI;
    return [a1, a2];
  }
  const ease = t => (1 - Math.cos(Math.PI * t)) / 2;
  // ciclo: A→B 1.1s, pausa .35s, B→A 1.9s, pausa .35s
  function phase(ms, hold) {
    if (hold) return 0;
    const T = [1100, 350, 1900, 350], tot = 3700;
    let m = ms % tot;
    if (m < T[0]) return ease(m / T[0]);
    m -= T[0]; if (m < T[1]) return 1;
    m -= T[1]; if (m < T[2]) return 1 - ease(m / T[2]);
    return 0;
  }
  function lerpPose(A, B, t) {
    const o = {}; const ks = new Set([...Object.keys(A), ...Object.keys(B)]);
    ks.forEach(k => { const a = A[k] ?? B[k], b = B[k] ?? A[k]; o[k] = a + (b - a) * t; });
    return o;
  }
  const seg = (a, b, w, cls) => `<line x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}" stroke-width="${w}" class="${cls}"/>`;

  function grip(g, W, ang) {
    if (!g) return '';
    if (g === 'db') { const p1 = pt(W, 7, ang + 90), p2 = pt(W, 7, ang - 90); return seg(p1, p2, 3, 'ap-bar') + `<circle cx="${p1.x}" cy="${p1.y}" r="4.2" class="ap-plate"/><circle cx="${p2.x}" cy="${p2.y}" r="4.2" class="ap-plate"/>`; }
    if (g === 'bar') return `<circle cx="${W.x}" cy="${W.y}" r="3.5" class="ap-plate"/>`;
    if (g === 'rope') return `<circle cx="${W.x}" cy="${W.y + 3}" r="3" class="ap-plate"/>`;
    if (g === 'pad') return '';
    return `<rect x="${W.x - 3}" y="${W.y - 5}" width="6" height="10" rx="2" class="ap-plate"/>`;
  }

  /* ===== Render estilo anatómico: cuerpo con volumen + músculos trabajados en rojo ===== */
  const F = n => (+n).toFixed(1);
  const dv = a => ({ x: Math.cos(rad(a)), y: -Math.sin(rad(a)) });
  const add = (P, v, k) => ({ x: P.x + v.x * k, y: P.y + v.y * k });
  const angOf = (P, Q) => Math.atan2(P.y - Q.y, Q.x - P.x) * 180 / Math.PI;
  const lerpP = (P, Q, t) => ({ x: P.x + (Q.x - P.x) * t, y: P.y + (Q.y - P.y) * t });
  // segmento con volumen (cápsula cónica)
  function limb(P, Q, r1, r2, cls) {
    const n = dv(angOf(P, Q) + 90);
    const a = add(P, n, r1), b = add(Q, n, r2), c = add(Q, n, -r2), d = add(P, n, -r1);
    return `<path d="M${F(a.x)},${F(a.y)} L${F(b.x)},${F(b.y)} A${r2},${r2} 0 0 1 ${F(c.x)},${F(c.y)} L${F(d.x)},${F(d.y)} A${r1},${r1} 0 0 1 ${F(a.x)},${F(a.y)} Z" class="${cls}"/>`;
  }
  // vientre muscular (elipse sobre un segmento)
  function belly(P, Q, t0, t1, side, off, w, cls) {

      const tor = (t0, t1) => { const s = TP.filter(r => r[0] >= t0 && r[0] <= t1); return [...s.map(([tt, f]) => add(lerpP(H, S, tt), nf, f)), ...s.slice().reverse().map(([tt, , b]) => add(lerpP(H, S, tt), nf, -b))]; };

      if (M.obliques) body += TB(.22, .58, 0, 0, 4.5, mc(M.obliques));
      if (M.lats) body += TB(.45, .86, 90, 3.5, 5.2, mc(M.lats));

      // torso en V

      if (M.chest) body += ell(at(.8, 6.4), 6.6, 4.8, mc(M.chest)) + ell(at(.8, -6.4), 6.6, 4.8, mc(M.chest));

      if (M.abs) body += ell(at(.43, 0), 5, 9, mc(M.abs));
      if (M.traps || M.upperback) body += ell(at(1.02, 7), 5, 2.6, mc(M.traps || M.upperback)) + ell(at(1.02, -7), 5, 2.6, mc(M.traps || M.upperback));

      const activeL = !a.single;
      front += armF(SL, EL, WL, activeL) + armF(SR, ER, WR, true);
      if (a.grip === 'pad') front += `<circle cx="${F(ER.x)}" cy="${F(ER.y)}" r="5" class="ap-pad"/><circle cx="${F(EL.x)}" cy="${F(EL.y)}" r="5" class="ap-pad"/>`;
      else { front += grip(a.grip, WR, p.fa); if (!a.single) front += grip(a.grip, WL, faL); }
      if (a.link) extra += seg({ x: a.link.from[0], y: a.link.from[1] }, WR, 1.4, 'ap-cable');
      if (a.link2) extra += seg({ x: a.link2[0], y: a.link2[1] }, WL, 1.4, 'ap-cable');
      if (a.draw) front += a.draw({ H, S, SR, SL, ER, EL, WR, WL, KR, KL, AR, AL }, ph, p);

    let holdTxt = '';
    void holdTxt;
    let body = back + extra + front;
    if (a.rot) body = `<g transform="rotate(${a.rot.join(' ')})">${body}</g>`;
    return `<ellipse cx="${F(H.x)}" cy="${FLOOR + 3}" rx="70" ry="5" class="ap-shadow"/>` + a.props + body + holdTxt;
  }

  // viewBox ajustado a la figura (como un encuadre de cámara)

/* ---------- Ciclo / fase ---------- */
function phaseInfo() {
  const st = new Date(S.settings.start + 'T00:00:00'); const d = Math.floor((Date.now() - st) / 864e5);
  const w = Math.max(1, Math.floor(d / 7) + 1);
  let t;
  if (w <= 2) t = 'Adaptación: RIR ~3, prioriza técnica y tolerancia.';
  else if (w <= 4) t = 'Consolida repeticiones y técnica; RIR 2–3.';
  else if (w <= 8) t = 'Progresa en reps o carga gradualmente; RIR ~2.';
  else if (w <= 11) t = 'RIR 1–2 solo en ejercicios seguros y sin dolor.';
  else if (w === 12) t = 'Evalúa resultados. Si hay fatiga, reduce series 30–50 % y RIR 3–4.';
  else t = 'Bloque completado: evalúa y reinicia la fecha de inicio en Ajustes.';
  return { w, t };
}
const curDay = () => S.days[S.cycle % S.days.length];

/* ---------- Historial helpers ---------- */
function lastEntry(exName, beforeId) {
  for (let i = S.logs.length - 1; i >= 0; i--) {
    const l = S.logs[i]; if (l.id === beforeId) continue;
    const e = l.exercises.find(x => x.name === exName && x.sets.some(s => s.done));
    if (e) return { log: l, ex: e };
  }
  return null;
}
function suggestion(exDef) {
  const le = lastEntry(exDef.name);
  if (!le) return null;
  const done = le.ex.sets.filter(s => s.done);
  const top = exDef.repMax;
  const allTop = done.length >= exDef.sets && done.every(s => (s.r ?? 0) >= top);
  const maxW = Math.max(...done.map(s => s.w || 0));
  const txt = done.map(s => fmtSet(exDef, s)).join(' · ');
  if (exDef.unit === 'cardio') return { prev: txt, tip: allTop ? `Cumpliste ${top} min. Puedes subir un poco ritmo, inclinación o resistencia.` : `Objetivo: ${top} min a ritmo constante.` };
  if (exDef.unit === 'bw') return { prev: txt, tip: allTop ? `Llegaste a ${top} reps en todas: sube reps, añade una serie o usa una variante más difícil.` : `Objetivo: ${top} reps en todas las series con buena técnica.`, up: allTop };
  if (exDef.unit === 'seg') return { prev: txt, tip: allTop ? 'Lograste el tiempo objetivo. Mantén si es tolerado.' : `Objetivo: ${top} s por serie sin dolor.` };
  return { prev: txt, tip: allTop && maxW > 0 ? `💪 Llegaste a ${top} reps en todas: sube un poco la carga (si no hay dolor articular).` : `Objetivo: llegar a ${top} reps en todas las series antes de subir peso.`, up: allTop };
}
const UNITS = { reps: 'Peso + repeticiones', bw: 'Repeticiones (sin peso)', seg: 'Duración (segundos)', cardio: 'Cardio (min · km · kcal)' };
const repTxt = e => { const r = e.repMin === e.repMax ? `${e.repMin}` : `${e.repMin}–${e.repMax}`; return e.unit === 'seg' ? r + ' s' : e.unit === 'cardio' ? r + ' min' : r; };
const hasF = (x, f) => (x.fields || []).includes(f);
function colsFor(x) {
  if (x.unit === 'bw') return [{ f: 'r', l: 'Reps', ph: repTxt(x), im: 'numeric' }, { f: 'rir', l: 'RIR', ph: x.rir, im: 'numeric' }];
  if (x.unit === 'seg') return [{ f: 'r', l: 'Segundos', ph: x.repMax + ' s', im: 'numeric' }];
  if (x.unit === 'cardio') return [{ f: 'r', l: 'Min', ph: x.repMax + '', im: 'decimal' }, ...(hasF(x, 'km') ? [{ f: 'km', l: 'Km', ph: 'km', im: 'decimal' }] : []), ...(hasF(x, 'kcal') ? [{ f: 'kcal', l: 'Kcal', ph: 'kcal', im: 'numeric' }] : [])];
  return [{ f: 'w', l: 'Peso', ph: 'kg', im: 'decimal' }, { f: 'r', l: 'Reps', ph: repTxt(x), im: 'numeric' }, { f: 'rir', l: 'RIR', ph: x.rir, im: 'numeric' }];
}
function fmtSet(e, s) {
  if (e.unit === 'bw') return `${s.r ?? '-'} reps`;
  if (e.unit === 'seg') return `${s.r ?? '-'} s`;
  if (e.unit === 'cardio') return [`${s.r ?? '-'} min`, s.km != null ? `${s.km} km` : '', s.kcal != null ? `${s.kcal} kcal` : ''].filter(Boolean).join(' · ');
  return `${s.w ?? '-'}kg×${s.r ?? '-'}`;
}

/* ---------- Render principal ---------- */
function render() {
  const app = $('#app');
  if (!S.active) UI.wkMin = false;
  if (S.active && !UI.wkMin) { app.innerHTML = renderWorkout(); bindWorkout(); }
  else {
    const views = { hoy: renderHoy, rutina: renderRutina, prog: renderProg, mas: renderMas };
    app.innerHTML = views[UI.tab]();
  }
  app.classList.toggle('withmini', !!(S.active && UI.wkMin));
  renderNav(); renderMini(); renderTimer(); ANIM.start(); nativeWorkout(); keepAwake(!!S.active);
  ensureTick();
}
function renderNav() {

  n.style.display = S.active && !UI.wkMin ? 'none' : '';

/* ---------- Entrenamiento minimizado: barra flotante ---------- */

}

}

/* Formulario de ejercicio genérico.

const applyToggle = (v, label = 'Guardar también en la rutina') => v == null ? '' : `<div class="toggle" style="margin-bottom:12px"><span>${label}<br><span class="small mut">Si lo apagas, el cambio aplica solo a esta sesión</span></span><div class="sw ${v ? 'on' : ''}" id="applySw" onclick="this.classList.toggle('on')"></div></div>`;

const cleanDef = v => ({ name: v.name, anim: v.anim, sets: v.sets, unit: v.unit, fields: v.fields || [], repMin: v.repMin, repMax: v.repMax, rir: v.rir, restSet: v.restSet, restAfter: v.restAfter, notes: v.notes || '' });

/* ---------- Selector para reemplazar / agregar ejercicios ---------- */
function exLibrary() {
  const seen = new Set(), mine = [];
  S.days.forEach(d => d.exercises.forEach(e => { const k = e.name.toLowerCase(); if (!seen.has(k)) { seen.add(k); mine.push(cleanDef(Object.assign({}, e, { sets: Array.isArray(e.sets) ? e.sets.length : e.sets }))); } }));
  const lib = Object.entries(ANIM.LIB).filter(([k, v]) => k !== 'generic' && !seen.has(v.name.toLowerCase())).map(([k, v]) => ({ name: v.name, anim: k, group: v.group, sets: v.def.sets, unit: v.track, fields: v.fields || [], repMin: v.def.repMin, repMax: v.def.repMax, rir: v.def.rir, restSet: v.def.restSet, restAfter: null, notes: '' }));
  mine.forEach(d => d.group = (ANIM.LIB[d.anim] || {}).group || 'Otros');
  return { mine, lib };
}
function pickExercise(title, applyDefault, onPick) {

function reorderModal(items, applyDefault, onDone) {
  modal(`<h2>Reordenar ejercicios</h2><p class="small mut" style="margin-top:-6px">Mantén presionado ☰ y arrastra, o usa las flechas.</p>
   <div class="ro-list" id="ro">${items.map((it, i) => `<div class="ro-it" data-k="${i}"><span class="ro-h">☰</span><div class="th" style="width:46px">${ANIM.still(it.anim)}</div><div class="sp nm">${esc(it.name)}</div><button class="ibtn ro-u">${IC.up}</button><button class="ibtn ro-d">${IC.down}</button></div>`).join('')}</div>
   ${applyToggle(applyDefault, 'Guardar este orden en la rutina')}
   <div class="grid2" style="margin-top:12px"><button class="btn" data-act="mclose">Cancelar</button><button class="btn pri" id="ro_ok">Guardar orden</button></div>`);
  const list = $('#ro');
  list.querySelectorAll('.ro-u').forEach(b => b.onclick = () => { const it = b.closest('.ro-it'); if (it.previousElementSibling) list.insertBefore(it, it.previousElementSibling); });
  list.querySelectorAll('.ro-d').forEach(b => b.onclick = () => { const it = b.closest('.ro-it'); if (it.nextElementSibling) list.insertBefore(it.nextElementSibling, it); });
  list.querySelectorAll('.ro-h').forEach(h => {
    h.onpointerdown = ev => {
      ev.preventDefault();
      const it = h.closest('.ro-it'); let startY = ev.clientY;
      it.classList.add('drag'); h.setPointerCapture(ev.pointerId);
      const move = e2 => {
        let dy = e2.clientY - startY;
        const prev = it.previousElementSibling, next = it.nextElementSibling;
        if (next && dy > next.offsetHeight / 2) { list.insertBefore(next, it); startY += next.offsetHeight + 6; dy = e2.clientY - startY; }
        else if (prev && dy < -prev.offsetHeight / 2) { list.insertBefore(it, prev); startY -= prev.offsetHeight + 6; dy = e2.clientY - startY; }
        it.style.transform = `translateY(${dy}px)`;
      };
      const up = () => { it.classList.remove('drag'); it.style.transform = ''; h.onpointermove = null; h.onpointerup = h.onpointercancel = null; };
      h.onpointermove = move; h.onpointerup = h.onpointercancel = up;
    };
  });
  $('#ro_ok').onclick = () => { const order = [...list.children].map(c => +c.dataset.k); const apply = readApply(); closeModal(); onDone(order, apply); save(); render(); toast('Orden guardado'); };
}

/* ---------- ENTRENAMIENTO ---------- */
function toActive(e, setsN) {
  const x = { exId: e.id || null, name: e.name, anim: e.anim, unit: e.unit, fields: e.fields || [], repMin: e.repMin, repMax: e.repMax, rir: e.rir, restSet: e.restSet, restAfter: e.restAfter, notes: e.notes, sets: Array.from({ length: setsN ?? e.sets }, () => ({ w: null, r: null, rir: null, done: false })) };
  const le = lastEntry(x.name);
  if (le) { const ds = le.ex.sets.filter(s => s.done); x.sets.forEach((s, i) => { const p = ds[i] || ds[ds.length - 1]; if (p) { s.w = p.w; s._auto = true; } }); }
  return x;
}
function startWorkout() {
  const d = curDay();
  S.active = { dayId: d.id, dayName: d.name, start: Date.now(), idx: 0, exercises: d.exercises.map(e => toActive(e)) };
  unlockAudio(); save(); render();
}
const wkView = () => S.settings.wkView === 'list' ? 'list' : 'tabs';
const activeDay = () => S.days.find(d => d.id === S.active?.dayId);
const isDone = e => e.sets.length > 0 && e.sets.every(s => s.done);

function renderWorkout() {
  const A = S.active, mode = wkView();
  if (A.idx >= A.exercises.length) A.idx = Math.max(0, A.exercises.length - 1);
  const el = Math.floor((Date.now() - A.start) / 1000);
  const doneSets = A.exercises.reduce((a, e) => a + e.sets.filter(s => s.done).length, 0), totSets = A.exercises.reduce((a, e) => a + e.sets.length, 0);
  const chips = A.exercises.map((e, i) => `<button class="chip ${i === A.idx ? 'on' : ''} ${isDone(e) ? 'done' : ''}" data-act="goex" data-i="${i}">${isDone(e) ? '✓ ' : ''}${esc(e.name.length > 22 ? e.name.slice(0, 21) + '…' : e.name)}</button>`).join('');
  const viewSeg = `<div class="seg" style="margin-bottom:8px"><button data-act="wkview" data-k="tabs" class="${mode === 'tabs' ? 'on' : ''}">▭ Por ejercicio</button><button data-act="wkview" data-k="list" class="${mode === 'list' ? 'on' : ''}">☰ Todos en una página</button></div>`;
  const tools = `<div class="row" style="gap:6px;margin:4px 0 12px;flex-wrap:wrap"><button class="btn sm" data-act="wkreorder">⇅ Reordenar</button><button class="btn sm" data-act="wkadd">＋ Agregar ejercicio</button></div>`;
  let body;
  if (!A.exercises.length) body = `<div class="card empty">No hay ejercicios en esta sesión.<br><br><button class="btn pri" data-act="wkadd">＋ Agregar ejercicio</button></div>`;
  else if (mode === 'tabs') body = `<div class="chips">${chips}</div>${exCard(A.idx, 'tabs')}
     <div class="grid2"><button class="btn" data-act="prevex" ${A.idx === 0 ? 'disabled' : ''}>← Anterior</button><button class="btn pri" data-act="nextex">${A.idx === A.exercises.length - 1 ? 'Terminar ✓' : 'Siguiente →'}</button></div>${tools}`;
  else body = `<div class="chips">${chips}</div>${A.exercises.map((_, i) => exCard(i, 'list')).join('')}${tools}<button class="btn ok blk" data-act="wkfinish">🏁 Finalizar entrenamiento</button>`;
  return `<header class="top"><div class="wk-top"><button class="ibtn" data-act="wkmin" title="Minimizar">${IC.down}</button><div class="sp"><h1 style="font-size:17px">${esc(A.dayName)}</h1><div class="sub"><span id="elapsed">${fmtT(el)}</span> · ${doneSets}/${totSets} series</div></div><button class="ibtn" data-act="wkcancel" title="Descartar" style="color:var(--bad)">${IC.x}</button><button class="btn ok sm" data-act="wkfinish">Finalizar</button></div></header>
  <main>${viewSeg}${body}<div style="height:${timer || holdT ? 230 : 10}px"></div></main>`;
}
function bindWorkout() {
  document.querySelectorAll('.sets input').forEach(inp => {
    inp.oninput = () => {
      const x = S.active.exercises[+inp.dataset.e], i = +inp.dataset.i, s = x.sets[i];
      s[inp.dataset.f] = num(inp.value);
      if (inp.dataset.f === 'w') { delete s._auto; x.sets.forEach((o, j) => { if (j > i && !o.done && (o.w == null || o._auto)) { o.w = s.w; o._auto = true; const t = document.querySelector(`.sets input[data-e="${inp.dataset.e}"][data-f="w"][data-i="${j}"]`); if (t) t.value = s.w ?? ''; } }); }
      save();
    };
  });
}
function scrollToEx(i) { if (wkView() !== 'list') { window.scrollTo(0, 0); return; } setTimeout(() => { const c = document.getElementById('ex-' + i); if (c) window.scrollTo({ top: c.getBoundingClientRect().top + window.scrollY - 70, behavior: 'smooth' }); }, 30); }
function setDone(ei, i) {
  const A = S.active, x = A.exercises[ei], s = x.sets[i];
  s.done = !s.done; delete s._auto;
  if (s.done && s.r == null) s.r = x.repMax; // si no escribió, asume el objetivo
  A.idx = ei; save();
  if (s.done) {
    beep('set');
    if (A.exercises.every(isDone)) { render(); return finishModal(); }
    if (isDone(x)) {
      const nx = A.exercises.find((e, j) => j > ei && !isDone(e)) || A.exercises.find(e => !isDone(e));
      startTimer(x.restAfter ?? S.settings.restEx, 'Descanso entre ejercicios', 'ex', nx ? `Siguiente ejercicio: ${nx.name}` : 'Último ejercicio terminado');
    } else {
      const n = x.sets.findIndex(o => !o.done);
      startTimer(x.restSet, `Descanso · serie ${n + 1} de ${x.sets.length}`, 'set', `Siguiente: serie ${n + 1} de ${x.sets.length} · ${x.name}`);
    }
  }
  render();
}
function startTimer(sec, label, kind, next = '') { unlockAudio(); stopHold(); if (!sec) { if (kind === 'ex') nextEx(); return; } timer = { end: Date.now() + sec * 1000, total: sec, label, kind, next, fired: false }; nativeTimer(timer.end, '⏰ ¡Descanso terminado!', next || '¡A darle!', 'rest'); render(); }
function renderTimer() {
  let t = $('.timer'); if (t) t.remove();
  if (holdT && UI.wkMin) return;
  if (holdT) {
    const el = document.createElement('div'); el.className = 'timer'; el.innerHTML = `<div class="in"><div class="lbl">${holdT.cardio ? 'Cardio en curso' : 'Isométrico · serie ' + (holdT.i + 1)} · objetivo ${holdT.cardio ? holdT.target / 60 + ' min' : holdT.target + ' s'}</div><div class="hold" id="holdv">0:00</div><div class="bar"><i id="holdb" style="width:0%"></i></div><div class="grid2"><button class="btn" data-act="holdcancel">Cancelar</button><button class="btn ok" data-act="holdstop">Listo ✓</button></div></div>`;
    document.body.appendChild(el); tickTimer(); return;
  }
  if (!timer || !S.active || UI.wkMin) return;
  const el = document.createElement('div'); el.className = 'timer';
  el.innerHTML = `<div class="in"><div class="row"><div class="sp"><div class="lbl" id="tlbl">${esc(timer.label)}</div><div class="big" id="tbig">${fmtT((timer.end - Date.now()) / 1000)}</div>${timer.next ? `<div class="small mut">${esc(timer.next)}</div>` : ''}</div>
    <div style="display:flex;flex-direction:column;gap:6px"><button class="btn sm" data-act="t+">+15 s</button><button class="btn sm" data-act="t-">−15 s</button></div></div>
    <div class="bar"><i id="tbar"></i></div><button class="btn pri blk" data-act="tskip">${timer.kind === 'ex' ? 'Siguiente ejercicio →' : 'Saltar descanso'}</button></div>`;
  document.body.appendChild(el); tickTimer();
}
function tickTimer() {
  const mb = $('#mb_t');
  if (mb) {
    if (holdT) { mb.textContent = '⏱ ' + fmtT((Date.now() - holdT.start) / 1000); mb.className = 'mb-r on'; }
    else if (timer) { const l = (timer.end - Date.now()) / 1000; mb.textContent = l > 0 ? '⏱ ' + fmtT(l) : '¡Vamos!'; mb.className = 'mb-r on' + (l <= 0 ? ' end' : ''); }
    else { mb.textContent = ''; mb.className = 'mb-r'; }
  }
  if (holdT) {
    const s = (Date.now() - holdT.start) / 1000; const v = $('#holdv'); if (v) v.textContent = fmtT(s);
    const b = $('#holdb'); if (b) b.style.width = Math.min(100, s / holdT.target * 100) + '%';
    if (!holdT.fired && s >= holdT.target) { holdT.fired = true; if (!NATIVE) beep('hold'); }
    return;
  }
  if (!timer) return;
  const left = (timer.end - Date.now()) / 1000;
  const big = $('#tbig'), bar = $('#tbar');
  if (big) big.textContent = left > 0 ? fmtT(left) : '¡Vamos!';
  if (bar) bar.style.width = Math.max(0, Math.min(100, 100 - left / timer.total * 100)) + '%';
  const box = $('.timer'); if (box) box.classList.toggle('end', left <= 0);
  if (left <= 0 && !timer.fired) { timer.fired = true; if (!NATIVE) beep('rest'); if (timer.kind === 'ex') setTimeout(() => { if (timer && timer.fired && timer.kind === 'ex') { timer = null; nextEx(); } }, 1500); else setTimeout(() => { if (timer && timer.fired) { timer = null; render(); } }, 4000); }
}
function startHold(ei, i) { unlockAudio(); clearTimer(); const x = S.active.exercises[ei]; S.active.idx = ei; holdT = { e: ei, i, start: Date.now(), target: (x.repMax || 20) * (x.unit === 'cardio' ? 60 : 1), cardio: x.unit === 'cardio' }; nativeTimer(holdT.start + holdT.target * 1000, '✅ ¡Tiempo cumplido!', `${x.unit === 'cardio' ? 'Cardio' : 'Isométrico'} · ${x.name}`, 'hold'); render(); }
function stopHold(save_ = false) {
  if (!holdT) return; const h = holdT; holdT = null; nativeCancel();
  if (save_ && S.active && S.active.exercises[h.e]) { const s = S.active.exercises[h.e].sets[h.i]; if (!s) return; s.r = h.cardio ? Math.round((Date.now() - h.start) / 6000) / 10 : Math.round((Date.now() - h.start) / 1000); s.done = false; save(); setDone(h.e, h.i); }
}
function nextEx() {
  const A = S.active; if (!A) return;
  const nx = A.exercises.findIndex((e, j) => j > A.idx && !isDone(e));
  const any = A.exercises.findIndex(e => !isDone(e));
  if (wkView() === 'tabs' && A.idx < A.exercises.length - 1) { A.idx++; save(); render(); window.scrollTo(0, 0); }
  else if (nx >= 0 || (wkView() === 'list' && any >= 0)) { A.idx = nx >= 0 ? nx : any; save(); render(); scrollToEx(A.idx); }
  else finishModal();
}

function exMenu(ei) {

  modal(`<h2>${esc(x.name)}</h2>

function routineEx(x) { const d = activeDay(); return d && x.exId ? d.exercises.find(e => e.id === x.exId) : null; }
function resizeSets(x, n) {
  const done = x.sets.filter(s => s.done).length; n = Math.max(n, done, 1);
  while (x.sets.length < n) { const l = x.sets[x.sets.length - 1]; x.sets.push({ w: l?.w ?? null, r: null, rir: null, done: false }); }
  while (x.sets.length > n) { const k = x.sets.map(s => s.done).lastIndexOf(false); if (k < 0) break; x.sets.splice(k, 1); }
}
function wkEdit(ei) {
  const x = S.active.exercises[ei];
  exForm(x, { apply: true, onSave: (v, apply) => {
    const { sets, ...rest } = v; Object.assign(x, rest); resizeSets(x, sets);
    if (apply) { const r = routineEx(x), d = activeDay(); if (r) Object.assign(r, v); else if (d) { const ne = Object.assign({ id: uid() }, v); d.exercises.push(ne); x.exId = ne.id; } }
    toast(apply ? 'Guardado en la sesión y en la rutina' : 'Cambio aplicado solo a esta sesión');
  } });
}
function wkReplace(ei) {
  const old = S.active.exercises[ei];
  pickExercise(`Reemplazar "${esc(old.name)}"`, false, (def, apply) => {
    const A = S.active, d = activeDay();
    let newId = null;
    if (apply && d) { const r = routineEx(old); const ne = Object.assign({ id: uid() }, cleanDef(def)); if (r) d.exercises.splice(d.exercises.indexOf(r), 1, ne); else d.exercises.push(ne); newId = ne.id; }
    const doneN = old.sets.filter(s => s.done).length;
    const nx = toActive(Object.assign({}, def, { id: newId }), doneN ? Math.max(1, old.sets.length - doneN) : def.sets);
    if (doneN) { old.sets = old.sets.filter(s => s.done); A.exercises.splice(ei + 1, 0, nx); A.idx = ei + 1; }
    else { A.exercises.splice(ei, 1, nx); A.idx = ei; }
    toast(`Reemplazado por ${def.name}`); setTimeout(() => scrollToEx(A.idx), 50);
  });
}
function wkAdd() {
  pickExercise('Agregar ejercicio a la sesión', false, (def, apply) => {
    const A = S.active, d = activeDay(); let id = null;
    if (apply && d) { const ne = Object.assign({ id: uid() }, cleanDef(def)); d.exercises.push(ne); id = ne.id; }
    A.exercises.push(toActive(Object.assign({}, def, { id }))); A.idx = A.exercises.length - 1;
    toast('Ejercicio agregado'); setTimeout(() => scrollToEx(A.idx), 50);
  });
}
function wkReorder() {
  const A = S.active, cur = A.exercises[A.idx];
  reorderModal(A.exercises, false, (order, apply) => {
    A.exercises = order.map(k => A.exercises[k]); A.idx = Math.max(0, A.exercises.indexOf(cur));

    if (apply && d) {
      const inSes = A.exercises.map(x => routineEx(x)).filter(Boolean);
      const rest = d.exercises.filter(e => !inSes.includes(e));

  });
}
function wkDel(ei) {

    else {

        const maxW = Math.max(...ds.map(s => s.w || 0)); const rm = Math.max(...ds.map(s => (s.w || 0) * (1 + (s.r || 0) / 30))); const vol = ds.reduce((a, s) => a + (s.w || 0) * (s.r || 0), 0); const reps = ds.reduce((a, s) => a + (s.r || 0), 0);
        const sum = f => Math.round(ds.reduce((a, s) => a + (s[f] || 0), 0) * 10) / 10;
        return { date: l.date, maxW, rm, vol, reps, repMx: Math.max(...ds.map(s => s.r || 0)), km: sum('km'), kcal: sum('kcal'), sets: ds, unit: e.unit || 'reps', anim: e.anim, ex: e }; }).filter(Boolean);
      const U = pts[pts.length - 1]?.unit || 'reps';
      const lowerBetter = !!(ANIM.LIB[pts[pts.length - 1]?.anim] || {}).lowerBetter;
      const metrics = U === 'seg' ? [['reps', 'Seg totales'], ['repMx', 'Mejor serie (s)']] : U === 'bw' ? [['reps', 'Reps totales'], ['repMx', 'Mejor serie']] : U === 'cardio' ? [['reps', 'Minutos'], ['km', 'Km'], ['kcal', 'Kcal']] : [['peso', lowerBetter ? 'Asistencia' : 'Peso máx'], ['rm', '1RM est.'], ['vol', 'Volumen'], ['reps', 'Reps totales']];
      if (!metrics.find(m => m[0] === UI.progMetric)) UI.progMetric = metrics[0][0];

      const isSeg = U !== 'reps';

function chart(pts) {
  if (!pts.length) return '';
  const W = 320, H = 150, p = { l: 34, r: 10, t: 12, b: 22 };
  const ys = pts.map(q => q.y); let mn = Math.min(...ys), mx = Math.max(...ys); if (mn === mx) { mn -= 1; mx += 1; } const pad = (mx - mn) * 0.12; mn -= pad; mx += pad;
  const X = i => p.l + (pts.length === 1 ? (W - p.l - p.r) / 2 : i * (W - p.l - p.r) / (pts.length - 1));
  const Y = v => p.t + (1 - (v - mn) / (mx - mn)) * (H - p.t - p.b);
  const path = pts.map((q, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(q.y).toFixed(1)}`).join(' ');
  const area = path + ` L${X(pts.length - 1)},${H - p.b} L${X(0)},${H - p.b} Z`;
  const grid = [0, 0.5, 1].map(f => { const v = mn + (mx - mn) * f; return `<line x1="${p.l}" x2="${W - p.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--chartgrid)"/><text x="${p.l - 5}" y="${Y(v) + 3}" text-anchor="end" font-size="9" fill="var(--mut)">${Math.round(v * 10) / 10}</text>`; }).join('');
  const lbl = i => { const d = new Date(pts[i].x); return `${d.getDate()} ${MESES[d.getMonth()]}`; };
  const xl = pts.length > 1 ? `<text x="${X(0)}" y="${H - 6}" font-size="9" fill="var(--mut)">${lbl(0)}</text><text x="${X(pts.length - 1)}" y="${H - 6}" font-size="9" fill="var(--mut)" text-anchor="end">${lbl(pts.length - 1)}</text>` : `<text x="${X(0)}" y="${H - 6}" font-size="9" fill="var(--mut)" text-anchor="middle">${lbl(0)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="cg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--acc)" stop-opacity=".35"/><stop offset="1" stop-color="var(--acc)" stop-opacity="0"/></linearGradient></defs>${grid}<path d="${area}" fill="url(#cg)"/><path d="${path}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>${pts.map((q, i) => `<circle cx="${X(i)}" cy="${Y(q.y)}" r="3.5" fill="var(--acc)" stroke="var(--chartdot)" stroke-width="1.5"/>`).join('')}${xl}</svg>`;
}

    <p><b>Doble progresión:</b> llega al extremo superior del rango en todas las series con buena técnica y el RIR indicado; solo entonces sube un poco la carga. Si hay dolor articular, no subas peso.</p>
    <p><b>RIR</b> = repeticiones en reserva. RIR 2: terminas sintiendo que podrías hacer ~2 reps más.</p></details></div>
   <div class="card info"><details class="acc"><summary>⚠️ Precauciones</summary>
    <p><b>Rodilla derecha:</b> adapta ejercicios a la tolerancia; prensa solo si es tolerada; evita lo que desencadene dolor.</p>
    <p><b>Codo:</b> evita apoyar la punta del codo mucho tiempo; suspende cualquier extensión que duela. Valoración profesional recomendada.</p>
    <p><b>Zona lumbar:</b> sin peso muerto rumano ni movimientos cargados que reproduzcan dolor. Hip thrust solo indoloro.</p>
    <p>Busca atención si hay bloqueo de rodilla, inestabilidad, inflamación importante, pérdida de fuerza o dolor intenso. Esta app no sustituye la valoración médica.</p></details></div>
   <div class="card info"><details class="acc"><summary>🍗 Recuperación</summary>
    <ul><li>Proteína: ~1,6–2,0 g/kg (≈118–148 g/día para 74 kg), repartida en comidas.</li><li>Sueño: aumentar gradualmente hacia 7–9 h.</li><li>Peso: 1 vez/semana. Brazo: cada 3–4 semanas + fotos comparables.</li><li>Anota cargas, reps, RIR y molestias en cada sesión.</li></ul></details></div>
   <div class="card"><h3>Respaldo de datos</h3><div class="small mut" style="margin-bottom:10px">${CL ? 'Sincronizado con tu cuenta de Claude ☁️ y guardado en este dispositivo.' : 'Tus datos se guardan en este dispositivo.'} Exporta una copia de vez en cuando.</div>
    <div class="grid2"><button class="btn" data-act="export">⬇ Exportar</button><button class="btn" data-act="import">⬆ Importar</button></div>
    <button class="btn bad blk" data-act="reset" style="margin-top:10px">Restaurar rutina original del PDF</button></div>
   <p class="small mut" style="text-align:center">Mi Rutina Gym · v1.7</p></main>`;
}
function alertCard() {
  let st = {}; try { st = JSON.parse(NATIVE.permissionsStatus()); } catch (e) { }
  const row = (ok, label, act, desc) => `<div class="toggle"><span>${ok === true ? '✅' : ok === false ? '⚠️' : '•'} ${label}<br><span class="small mut">${desc}</span></span>${ok === true ? '' : `<button class="btn sm" data-act="${act}">Activar</button>`}</div>`;
  return `<div class="card"><h3>🔔 Alertas en segundo plano</h3>
    ${row(st.notif, 'Notificaciones', 'perm_notif', 'Para mostrar el aviso de fin de descanso')}
    ${row(st.exact, 'Alarmas y recordatorios', 'perm_exact', 'Para que suene a tiempo aunque uses otra app')}
    ${row(st.battery, 'Batería sin restricciones', 'battery', 'Evita que el teléfono congele la app')}
    <div class="tip">En Xiaomi/Redmi/POCO: Ajustes → Apps → Mi Rutina Gym → activa <b>Inicio automático</b> y en Ahorro de batería elige <b>Sin restricciones</b>. En Samsung: Batería → <b>Sin restricciones</b>.</div>
    <button class="btn pri blk" data-act="testalert">▶ Probar alerta en 10 s (sal de la app)</button>
    <button class="btn sm ghost blk" data-act="perm_app" style="margin-top:6px">Abrir ajustes de la app</button></div>`;
}
function exportData() {
  const txt = JSON.stringify(S);
  if (window.AndroidBridge && AndroidBridge.share) { AndroidBridge.share(txt); return; }
  try { const b = new Blob([txt], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `rutina-gym-${todayISO()}.json`; document.body.appendChild(a); a.click(); a.remove(); } catch (e) { }
  modal(`<h2>Exportar</h2><p class="small mut">Si no se descargó el archivo, copia este texto y guárdalo (WhatsApp a ti mismo, notas, etc.).</p><div class="field"><textarea rows="6" id="exptxt" readonly>${esc(txt)}</textarea></div><div class="grid2"><button class="btn" data-act="mclose">Cerrar</button><button class="btn pri" id="cpy">Copiar</button></div>`);
  $('#cpy').onclick = () => { const t = $('#exptxt'); t.select(); try { navigator.clipboard.writeText(t.value).then(() => toast('Copiado')); } catch (e) { document.execCommand('copy'); toast('Copiado'); } };
}
function importData() {
  modal(`<h2>Importar respaldo</h2><p class="small mut">Pega el texto exportado o elige el archivo .json. Reemplazará los datos actuales.</p>
   <div class="field"><input type="file" accept=".json,application/json" id="impf"></div><div class="field"><textarea rows="6" id="imptxt" placeholder="Pega aquí…"></textarea></div>
   <div class="grid2"><button class="btn" data-act="mclose">Cancelar</button><button class="btn pri" id="impok">Importar</button></div>`);
  $('#impf').onchange = ev => { const f = ev.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => $('#imptxt').value = r.result; r.readAsText(f); };
  $('#impok').onclick = () => { try { const o = JSON.parse($('#imptxt').value); if (!o.days || !Array.isArray(o.days)) throw 0; S = Object.assign(defaultState(), o); save(); S.logs.forEach(l => cloudLog(l)); closeModal(); render(); toast('Datos importados'); } catch (e) { toast('Texto no válido'); } };
}

/* ---------- Modal ---------- */
function modal(html) { closeModal(); const bg = document.createElement('div'); bg.className = 'modal-bg'; bg.innerHTML = `<div class="modal">${html}</div>`; bg.onclick = e => { if (e.target === bg) closeModal(); }; document.body.appendChild(bg); ANIM.start(); }
function closeModal() { document.querySelectorAll('.modal-bg').forEach(m => m.remove()); }
function confirmBox(msg, ok, okTxt = 'Eliminar') { modal(`<h2>¿Seguro?</h2><p>${msg}</p><div class="grid2"><button class="btn" data-act="mclose">Cancelar</button><button class="btn bad" id="cf_ok">${okTxt}</button></div>`); $('#cf_ok').onclick = () => { closeModal(); ok(); }; }

/* ---------- Eventos ---------- */
document.addEventListener('click', ev => {
  const tb = ev.target.closest('[data-tab]'); if (tb) { UI.tab = tb.dataset.tab; UI.editDay = null; render(); window.scrollTo(0, 0); return; }
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, i = el.dataset.i != null ? +el.dataset.i : null;
  const day = UI.editDay ? S.days.find(d => d.id === UI.editDay) : null;
  const EI = () => el.dataset.e != null ? +el.dataset.e : S.active.idx;
  const mv = (arr, i, d) => { const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; save(); render(); };
  switch (a) {
    case 'mclose': closeModal(); break;
    case 'tech': techModal(el.dataset.anim, el.dataset.name); break;
    case 'setcycle': S.cycle = i; save(); render(); break;
    case 'restdone': advanceCycle(); save(); render(); toast('Descanso completado ✓'); break;
    case 'startwk': startWorkout(); window.scrollTo(0, 0); break;
    case 'openday': UI.editDay = el.dataset.id; render(); window.scrollTo(0, 0); break;
    case 'closeday': UI.editDay = null; render(); break;
    case 'dayup': mv(S.days, i, -1); break;
    case 'daydown': mv(S.days, i, 1); break;
    case 'addday': dayForm(null); break;
    case 'dayedit': dayForm(day); break;
    case 'daydel': confirmBox(`Se eliminará el día "${esc(day.name)}" y sus ejercicios. Los registros guardados se conservan.`, () => { S.days = S.days.filter(d => d !== day); if (!S.days.length) S.days = defaultDays(); S.cycle = S.cycle % S.days.length; UI.editDay = null; save(); render(); }); break;
    case 'exadd': exFormDay(day, null); break;
    case 'exedit': exFormDay(day, i); break;
    case 'dayreorder': { const dd = day || curDay(); reorderModal(dd.exercises, null, order => { dd.exercises = order.map(k => dd.exercises[k]); }); break; }
    case 'hoyedit': exFormDay(curDay(), i); break;
    case 'hoyadd': exFormDay(curDay(), null); break;
    case 'hoyreplace': { const dd = curDay(), old = dd.exercises[i]; pickExercise(`Reemplazar "${esc(old.name)}"`, null, def => { dd.exercises.splice(dd.exercises.indexOf(old), 1, Object.assign({ id: uid() }, cleanDef(def))); toast('Ejercicio reemplazado'); }); break; }
    case 'hoydel': { const dd = curDay(); confirmBox(`Eliminar "${esc(dd.exercises[i].name)}" de ${esc(dd.name)}.`, () => { dd.exercises.splice(i, 1); save(); render(); }); break; }
    case 'exdel': confirmBox(`Eliminar "${esc(day.exercises[i].name)}" de ${esc(day.name)}.`, () => { day.exercises.splice(i, 1); save(); render(); }); break;
    case 'exup': mv(day.exercises, i, -1); break;
    case 'exdown': mv(day.exercises, i, 1); break;
    // entreno
    case 'goex': S.active.idx = i; save(); render(); scrollToEx(i); break;
    case 'prevex': if (S.active.idx > 0) { S.active.idx--; save(); render(); } break;
    case 'nextex': clearTimer(); nextEx(); break;
    case 'setdone': setDone(EI(), i); break;
    case 'addset': { const x = S.active.exercises[EI()]; resizeSets(x, x.sets.length + 1); save(); render(); break; }
    case 'rmset': { const x = S.active.exercises[EI()]; resizeSets(x, x.sets.length - 1); save(); render(); break; }
    case 'resttimer': { const x = S.active.exercises[EI()]; startTimer(x.restSet, 'Descanso', 'set', x.name); break; }
    case 'exmenu': exMenu(EI()); break;
    case 'wkedit': wkEdit(EI()); break;
    case 'wkreplace': wkReplace(EI()); break;
    case 'wkdel': wkDel(EI()); break;
    case 'wkadd': wkAdd(); break;
    case 'wkreorder': wkReorder(); break;
    case 'wkview': S.settings.wkView = el.dataset.k; save(); render(); if (el.dataset.k === 'list') scrollToEx(S.active?.idx || 0); break;
    case 't+': timer.end += 15000; timer.total += 15; timer.fired = false; nativeTimer(timer.end, '⏰ ¡Descanso terminado!', timer.next || '¡A darle!', 'rest'); tickTimer(); break;
    case 't-': timer.end -= 15000; nativeTimer(timer.end, '⏰ ¡Descanso terminado!', timer.next || '¡A darle!', 'rest'); tickTimer(); break;
    case 'tskip': { const k = timer?.kind; clearTimer(); if (k === 'ex') nextEx(); else render(); break; }
    case 'hold': startHold(EI(), i); break;
    case 'holdstop': stopHold(true); break;
    case 'holdcancel': holdT = null; nativeCancel(); render(); break;
    case 'wkfinish': finishModal(); break;
    case 'wkmin': UI.wkMin = true; render(); window.scrollTo(0, 0); toast('Entrenamiento minimizado: sigue corriendo abajo'); break;
    case 'wkmax': UI.wkMin = false; closeModal(); render(); scrollToEx(S.active?.idx || 0); break;
    case 'wkcancel': confirmBox('Se descartará el entrenamiento en curso sin guardar.', () => { S.active = null; clearTimer(); holdT = null; clearInterval(timerInt); save(); render(); }, 'Descartar'); break;
    // progreso
    case 'pseg': UI.progSeg = el.dataset.k; render(); break;
    case 'pmet': UI.progMetric = el.dataset.k; render(); break;
    case 'openlog': logModal(el.dataset.id); break;
    case 'dellog': confirmBox('Se eliminará este registro de entrenamiento.', () => { const l = S.logs.find(x => x.id === el.dataset.id); S.logs = S.logs.filter(x => x !== l); if (l) cloudLog(l, true); save(); render(); }); break;
    case 'addbody': { const p = num($('#b_w').value), br = num($('#b_a').value); if (p == null && br == null) return toast('Escribe peso o brazo'); S.body.push({ id: uid(), date: $('#b_d').value || todayISO(), peso: p, brazo: br }); save(); render(); toast('Registro guardado'); break; }
    case 'delbody': S.body = S.body.filter(b => b.id !== el.dataset.id); save(); render(); break;
    // ajustes
    case 'settheme': S.settings.theme = el.dataset.k; save(); applyTheme(); render(); break;
    case 'themetoggle': S.settings.theme = isDark() ? 'light' : 'dark'; save(); applyTheme(); render(); break;
    case 'perm_notif': try { NATIVE.openNotificationSettings(); } catch (e) { } break;
    case 'perm_exact': try { NATIVE.openExactAlarmSettings(); } catch (e) { } break;
    case 'perm_app': try { NATIVE.openAppDetails(); } catch (e) { } break;
    case 'testalert': try { NATIVE.testAlert(10, loud()); toast('Ahora sal de la app (abre WhatsApp, por ejemplo). Sonará en 10 s.'); } catch (e) { } break;
    case 'setview': S.settings.wkView = el.dataset.k; save(); render(); break;
    case 'sw': S.settings[el.dataset.k] = !S.settings[el.dataset.k]; save(); render(); break;
    case 'testvib': if (NATIVE && NATIVE.vibrate) NATIVE.vibrate('rest'); else if (navigator.vibrate) navigator.vibrate([600, 250, 600]); else toast('Este dispositivo no permite vibrar desde la web'); break;
    case 'testbeep': unlockAudio(); beep(el.dataset.k || 'rest'); break;
    case 'battery': try { NATIVE.openBatterySettings(); } catch (e) { } break;
    case 'loud': S.settings.loud = !loud(); save(); render(); break;
    case 'export': exportData(); break;
    case 'import': importData(); break;
    case 'reset': confirmBox('Se restaurará la rutina original del PDF (días y ejercicios). Tus registros e historial se conservan.', () => { S.days = defaultDays(); S.cycle = 0; save(); render(); toast('Rutina restaurada'); }, 'Restaurar'); break;
  }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.matches('[data-act="pexsel"]')) { UI.progEx = t.value; render(); }
  if (t.id === 's_rest') { S.settings.restEx = Math.max(0, parseInt(t.value) || 0); save(); }
  if (t.id === 's_start') { S.settings.start = t.value || todayISO(); save(); }
});
// botón atrás (Android)
window.handleBack = () => {
  if (document.querySelector('.modal-bg')) { closeModal(); return true; }
  if (S.active && !UI.wkMin) { UI.wkMin = true; render(); return true; }
  if (UI.editDay) { UI.editDay = null; render(); return true; }
  if (!S.active && UI.tab !== 'hoy') { UI.tab = 'hoy'; render(); return true; }
  return false;
};
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tickTimer(); if (UI.tab === 'mas' && !S.active && !document.querySelector('.modal-bg')) render(); } });
render();
initCloud();
</script>
</body></html>
